# Non-secret configuration. Secrets belong in .env / GitHub Actions secrets.
# Adding a dataset: write datapulse/sources/<name>.py, then add a block below.

environment: local
log_level: INFO
respect_robots_txt: true

storage:
  backend: parquet_local      # swap for s3/duckdb later without touching sources
  root: datasets
  compression: zstd

sources:
  mandi_prices:
    enabled: true            # needs DATAPULSE_API_KEYS__DATA_GOV_IN
    domain: food_mandi
    schedule: daily
    rate_limit_per_sec: 1.0
    options:
      page_size: 1000
      # Circuit breaker only -- paging stops when the API's `total` is reached.
      max_pages: 50
      # The portal will not serve past offset 10000, and the dataset is bigger
      # than that. Slicing by state keeps every query under the ceiling, so the
      # collection is complete and stable rather than a shifting ~10k sample.
      partition:
        field: state
        discovery_pages: 10  # sample the whole reachable window before slicing
      summary:
        label: "Food & Mandi Prices"
        chart_title: "Average modal price by commodity (INR / quintal)"
        dimension: commodity
        metric: modal_price
        distinct_counts: [state, market]
        top_by_count: commodity
        preview_columns: [state, district, market, commodity, variety, min_price, max_price, modal_price]

