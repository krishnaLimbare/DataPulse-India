[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "Automated multi-dataset daily data hub for India (cars, rents, jobs, mandi prices)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28.1",
  "pandas>=3.0.5",
  "pyarrow>=25.0.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "PyYAML>=6.0.3",
  "tenacity>=9.1.4",
  "typer>=0.27.1",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.4", "mypy>=2.3.1", "respx>=0.23.1", "pre-commit>=4.6.2"]

[project.scripts]
datapulse = "datapulse.cli:app"

[tool.setuptools.packages.find]
include = ["datapulse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Typer expresses CLI options as call-valued defaults; that is the framework idiom.
"datapulse/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
