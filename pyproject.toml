[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "Automated multi-dataset daily data hub for India (cars, rents, jobs, mandi prices)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "tenacity>=8.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "respx>=0.21", "pre-commit>=4.6.2"]

[project.scripts]
datapulse = "datapulse.cli:app"

[tool.setuptools.packages.find]
include = ["datapulse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Typer expresses CLI options as call-valued defaults; that is the framework idiom.
"datapulse/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
