version: '3.8'

services:
  datapulse-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapulse_collector
    environment:
      - DATAPULSE_ENVIRONMENT=production
      - DATAPULSE_LOG_LEVEL=INFO
      - DATAPULSE_API_KEYS__DATA_GOV_IN=${DATAPULSE_API_KEYS__DATA_GOV_IN}
    volumes:
      - ./datasets:/app/datasets
    command: python -m datapulse.cli run --source mandi_prices

  datapulse-dashboard:
    image: nginx:alpine
    container_name: datapulse_dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./datasets:/usr/share/nginx/datasets:ro
